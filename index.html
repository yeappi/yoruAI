<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>yoruAI</title>
<style>
/* 色は1色だけ。赤ピンクはアクセント（自分の吹き出し・未読・送信・選択中）にだけ使う */
[data-mode="light"]{
  --accent:#EE3A5D; --accent-press:#D62E50; --accent-soft:#FDECEF;
  --bg:#FFFFFF; --group:#F3F3F5; --chat:#F1F1F4;
  --text:#18181B; --sub:#8B8B93; --faint:#B9B9C0;
  --hair:rgba(24,24,27,.09); --fill:#F1F1F3; --ai:#FFFFFF;
  --bar:rgba(255,255,255,.94);
}
[data-mode="night"]{
  --accent:#F5506F; --accent-press:#E23E5E; --accent-soft:rgba(245,80,111,.14);
  --bg:#141416; --group:#0C0C0D; --chat:#0E0E10;
  --text:#F2F2F4; --sub:#8E8E96; --faint:#5A5A61;
  --hair:rgba(255,255,255,.09); --fill:#232327; --ai:#242428;
  --bar:rgba(20,20,22,.94);
}
:root{--font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;--ease:cubic-bezier(.25,.8,.25,1)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#E4E4E8;font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit;caret-color:var(--accent)}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);color:var(--text);overflow:hidden;font-size:15px;line-height:1.45}
@media(min-width:500px){body{display:flex;align-items:center;justify-content:center}#app{height:min(880px,100dvh);border-radius:24px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 30px 60px -30px rgba(0,0,0,.35)}}

/* ---------- 共通 ---------- */
#tab{position:absolute;inset:0 0 calc(56px + env(safe-area-inset-bottom)) 0;overflow-y:auto}
.hd{position:sticky;top:0;z-index:3;display:flex;align-items:center;height:52px;padding:0 8px 0 20px;margin-top:env(safe-area-inset-top);background:var(--bg)}
.hd h1{flex:1;font-size:21px;font-weight:700;letter-spacing:.01em}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--text)}
.ib svg{width:24px;height:24px}
.ib:active{background:var(--fill)}
.ib.ac{color:var(--accent)}
.av{width:var(--s);height:var(--s);border-radius:36%;flex-shrink:0;display:grid;place-items:center;background:var(--tb);color:var(--tf);font-weight:600;font-size:calc(var(--s)*.4)}
[data-mode="night"] .av{filter:saturate(.85) brightness(.9)}
.av.me{--tb:#E7E7EB;--tf:#6B6B73}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av{overflow:hidden}
.sec{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 6px;font-size:13px;color:var(--sub)}
.sec b{font-weight:500}

/* 行 */
.row{display:flex;align-items:center;gap:14px;width:100%;padding:8px 20px;min-height:62px}
.row:active{background:var(--fill)}
.row .tx{flex:1;min-width:0}
.row .t1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{height:30px;padding:0 14px;border-radius:15px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;flex-shrink:0}
.chip:active{background:var(--accent);color:#fff}

/* 自分 */
.mine{display:flex;align-items:center;gap:16px;padding:10px 20px 18px;width:100%;border-bottom:1px solid var(--hair)}
.mine .t1{font-size:18px;font-weight:700}
.mine .t2{font-size:13px;color:var(--sub);margin-top:2px}

/* トーク一覧 */
.trow{min-height:76px;padding:10px 20px}
.trow .av{--s:52px}
.trow .top{display:flex;align-items:baseline;gap:8px}
.trow .top .t1{flex:1}
.trow .tm{font-size:12px;color:var(--sub);flex-shrink:0}
.trow .bot{display:flex;align-items:center;gap:8px;margin-top:3px}
.trow .bot .t2{flex:1;margin:0;font-size:14px}
.trow .bot .t2.typ{color:var(--accent)}
.ub{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;flex-shrink:0}
.empty{padding:90px 40px 0;text-align:center}
.empty b{display:block;font-size:17px;font-weight:600}
.empty p{font-size:14px;color:var(--sub);margin:8px 0 22px;line-height:1.6}
.btn{height:50px;padding:0 28px;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
.btn:active{background:var(--accent-press)}
.btn.wide{width:100%}
.btn.line{background:var(--fill);color:var(--text)}

/* 設定 */
.set{background:var(--group);min-height:100%}
.set .hd{background:var(--group)}
.grp{margin:0 16px;border-radius:12px;background:var(--bg);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;position:relative}
.cell + .cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--hair)}
.cell label{flex-shrink:0;width:92px;font-size:15px}
.cell input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;text-align:right;color:var(--sub)}
.cell input:focus{color:var(--text)}
.cell .sp{flex:1}
.seg{display:flex;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{min-width:64px;height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--bg);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
[data-mode="night"] .seg button.on{background:#3A3A3F}
.foot{font-size:12px;color:var(--sub);padding:8px 32px 0;line-height:1.6}
.danger{width:100%;min-height:50px;padding:0 16px;color:#E5484D;font-size:15px;text-align:left}

/* ---------- タブバー ---------- */
#nav{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;padding-bottom:env(safe-area-inset-bottom);background:var(--bar);border-top:1px solid var(--hair);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#nav button{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;color:var(--faint);position:relative}
#nav button svg{width:25px;height:25px}
#nav button.on{color:var(--accent)}
.nb{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}

/* ---------- レイヤー ---------- */
.layer{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);visibility:hidden;transform:translateX(100%);transition:transform .3s var(--ease),visibility 0s .3s}
.layer.open{visibility:visible;transform:none;transition:transform .3s var(--ease)}
.layer.up{transform:translateY(100%)}
.layer.up.open{transform:none}
@media(prefers-reduced-motion:reduce){.layer,.layer.open{transition:none}}
.lhd{display:flex;align-items:center;height:52px;padding:0 4px;margin-top:env(safe-area-inset-top);flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--hair)}
.lhd .ttl{flex:1;text-align:center;font-size:16px;font-weight:600;min-width:0}
.lhd .ttl small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-top:1px}

/* ---------- トークルーム ---------- */
#chat{background:var(--chat)}
#chat .lhd{background:var(--bar);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#msgs{flex:1;overflow-y:auto;padding:8px 12px 16px}
.dsep{text-align:center;margin:18px 0 10px}
.dsep span{font-size:11px;color:var(--sub);padding:3px 10px;border-radius:10px;background:rgba(0,0,0,.05)}
[data-mode="night"] .dsep span{background:rgba(255,255,255,.06)}
.sys{text-align:center;margin:10px 0;font-size:12px;color:var(--sub)}
.sys.up{color:var(--accent);font-weight:600}
.m{display:flex;gap:8px;margin-top:3px;align-items:flex-end}
.m.first{margin-top:12px}
.m.ai .aw{width:36px;flex-shrink:0;align-self:flex-start}
.m.ai .col{min-width:0;max-width:72%}
.m.ai .nm{font-size:12px;color:var(--sub);margin:0 0 4px 2px}
.m.ai .bw{display:flex;align-items:flex-end;gap:6px}
.m.me{justify-content:flex-end}
.b{padding:8px 13px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word;border-radius:18px}
.m.ai .b{background:var(--ai);color:var(--text)}
[data-mode="light"] .m.ai .b{box-shadow:0 0 0 .5px rgba(0,0,0,.06)}
.m.me .b{background:var(--accent);color:#fff;max-width:72%}
.meta{font-size:10px;color:var(--sub);line-height:1.3;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;padding-bottom:1px}
.m.ai .meta{align-items:flex-start}
.typing .b{display:flex;gap:4px;padding:13px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.35}30%{opacity:1}}
.cin{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--hair);flex-shrink:0}
.cin textarea{flex:1;resize:none;border:0;outline:0;border-radius:19px;background:var(--fill);padding:9px 14px;font-size:15px;line-height:1.35;max-height:110px}
.send{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--faint);flex-shrink:0}
.send.on{color:var(--accent)}
.send svg{width:24px;height:24px}

/* ---------- プロフィール ---------- */
#profile{background:var(--tb)}
[data-mode="night"] #profile{background:#1E1E22}
#profile .lhd{background:transparent;border:0}
.pf{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px 8px;text-align:center}
.pf .av{box-shadow:0 0 0 4px var(--bg)}
.pf h2{font-size:22px;font-weight:700;margin-top:16px}
.pf .job{font-size:13px;color:var(--sub);margin-top:4px}
.pf .st{font-size:14px;margin-top:14px;line-height:1.6;color:var(--text);opacity:.85}
.pf-panel{background:var(--bg);border-radius:20px 20px 0 0;padding:20px 20px max(20px,env(safe-area-inset-bottom))}
.aff{display:flex;align-items:center;gap:12px;font-size:13px}
.aff .lv{font-weight:700;color:var(--accent);flex-shrink:0}
.aff .bar{flex:1;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.aff .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.aff .nx{color:var(--sub);flex-shrink:0;font-size:12px}
.pf-note{margin:8px 0 0;font-size:12px;color:var(--sub);text-align:center}
.pf-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);padding:14px 0 18px;border-bottom:1px solid var(--hair)}
.pf-meta span:last-child{color:var(--text)}
.acts{display:flex;justify-content:center;gap:48px;padding-top:16px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--text);min-width:64px}
.acts svg{width:26px;height:26px;color:var(--accent)}

/* ---------- 友だち追加 ---------- */
#add .body{flex:1;overflow-y:auto;padding-bottom:12px}
.cards{display:flex;gap:12px;overflow-x:auto;padding:20px 32px 8px;scroll-snap-type:x mandatory;scroll-padding:0 32px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 100%;scroll-snap-align:center;border-radius:16px;background:var(--bg);box-shadow:0 0 0 1px var(--hair),0 8px 24px -16px rgba(0,0,0,.3);overflow:hidden;transition:opacity .25s}
.card.off{opacity:.45}
.card .cv{height:150px;background:var(--tb);display:grid;place-items:center;position:relative}
.card .cv .av{box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.card .got{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px;background:var(--bg);color:var(--sub)}
.card .ci{padding:16px 18px 18px}
.card h3{font-size:19px;font-weight:700}
.card .job{font-size:13px;color:var(--sub);margin-top:2px}
.card .cp{font-size:14px;line-height:1.6;margin-top:12px}
.card .tg{font-size:12px;color:var(--sub);margin-top:10px}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--hair)}
.dots i.on{background:var(--accent)}
.meet-sec{padding:26px 20px 0}
.meet-sec h4{font-size:13px;font-weight:500;color:var(--sub);margin-bottom:10px}
.seg.full{display:flex}
.seg.full button{flex:1;height:36px}
.meet-d{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.6}
.add-ft{padding:10px 20px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--hair);flex-shrink:0}

/* ---------- 通知・トースト ---------- */
#banner{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:50;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 0 0 1px var(--hair),0 12px 30px -12px rgba(0,0,0,.3);color:var(--text);transform:translateY(-140%);transition:transform .35s var(--ease)}
#banner.show{transform:none}
#banner .tx{flex:1;min-width:0}
#banner .l1{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
#banner .l1 small{font-size:12px;font-weight:400;color:var(--sub)}
#banner p{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;transform:translateX(-50%);opacity:0;padding:10px 16px;border-radius:10px;background:rgba(24,24,27,.9);color:#fff;font-size:13px;white-space:nowrap;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

#auth-gate{display:none;position:fixed;inset:0;z-index:9000;background:var(--bg);color:var(--text);font-family:var(--font);align-items:center;justify-content:center;padding:24px;overflow-y:auto}
#auth-gate.show{display:flex}
#auth-gate .auth-panel{width:min(340px,100%);display:flex;flex-direction:column;align-items:stretch}
#auth-gate .auth-logo{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;letter-spacing:-.02em}
#auth-gate h3{margin:0 0 6px;font-size:22px;font-weight:700;text-align:center;letter-spacing:.01em}
#auth-gate p{font-size:14px;line-height:1.6;color:var(--sub);text-align:center;margin:0 0 24px;overflow-wrap:anywhere}
#auth-gate input{display:block;width:100%;padding:14px 16px;margin:0 0 12px;border:0;border-radius:12px;background:var(--fill);color:var(--text);font:inherit;font-size:16px;box-sizing:border-box;outline:none}
#auth-gate input::placeholder{color:var(--faint)}
#auth-gate input:focus-visible{box-shadow:0 0 0 2px var(--accent)}
#auth-gate button{width:100%;text-align:center;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
#auth-gate button:active{background:var(--accent-press)}
#auth-gate button:disabled{opacity:.5}
#auth-gate button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#auth-gate small{color:var(--sub);display:block;font-size:12px;line-height:1.6;text-align:center;margin:16px 0 0}

/* 会話ラボ。既存のホーム・トークUIと切り離す。 */
#lab{z-index:30;background:var(--group)}
#lab .lhd{background:var(--bg)}
.lab-body{flex:1;overflow-y:auto;padding:16px 16px max(28px,env(safe-area-inset-bottom));overscroll-behavior:contain}
.lab-panel{background:var(--bg);border-radius:12px;margin-bottom:16px;padding:15px}
.lab-panel h3{font-size:15px;margin:0 0 10px;font-weight:700}
.lab-panel p{font-size:12px;color:var(--sub);line-height:1.6;margin:5px 0}
.lab-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.lab-row+.lab-row{border-top:1px solid var(--hair)}
.lab-label{flex:1;font-size:14px}
.lab-switch{min-width:45px;border-radius:12px;background:var(--fill);padding:5px 10px;font-size:12px;color:var(--sub)}
.lab-switch.on{background:var(--accent);color:#fff}
.lab-entry{display:block;width:100%;background:var(--fill);border:0;border-radius:8px;padding:11px 12px;font-size:14px;color:var(--text);outline:0;box-sizing:border-box;resize:vertical}
.lab-small{padding:7px 10px;background:var(--fill);border-radius:8px;font-size:12px;color:var(--text)}
.lab-primary{background:var(--accent);color:#fff;border-radius:10px;min-height:40px;padding:8px 14px;font-size:14px;font-weight:600}
.lab-primary:disabled{opacity:.45}
.lab-choice{border:1px solid var(--hair);background:var(--bg);border-radius:9px;padding:10px;margin-top:8px}
.lab-choice b{display:block;font-size:12px;margin-bottom:6px}
.lab-choice p{font-size:14px;color:var(--text);white-space:pre-wrap}
.lab-score{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:13px;gap:10px}
.lab-bar{width:110px;height:5px;border-radius:3px;background:var(--fill);overflow:hidden}
.lab-bar>i{display:block;height:100%;background:var(--accent)}
.lab-trace{border-top:1px solid var(--hair);padding:10px 0;font-size:12px}
.lab-trace small{color:var(--sub)}
.lab-inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
</style>
</head>
<body>
<div id="app" data-mode="light">
  <main id="tab"></main>
  <nav id="nav"></nav>
  <section id="chat" class="layer"></section>
  <section id="profile" class="layer up"></section>
  <section id="add" class="layer up"></section>
  <section id="lab" class="layer up"></section>
  <button id="banner"></button>
  <div id="toast" role="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="/casts.js"></script>
<script src="/relation.js"></script>
<script src="/lab-ui.js"></script>
<script src="/reply-timing.js"></script>
<script>
/* =========================================================
   yoruAI — プロトタイプ（1ファイル）
   1. DATA    … キャラ(CHARS)・出会い方(MEETS)・親密度(LEVELS)・性別(GENDERS)
   2. STORE   … localStorage 保存
   3. AI      … generateReply() が唯一の窓口。mock / gemini 切替
   4. CHAT    … 送信→既読→入力中→返信 のフロー
   5. VIEWS   … ホーム / トーク / 設定 / トークルーム / プロフィール / 友だち追加
   ========================================================= */

/* ---------- 1. DATA ---------- */
const MEETS = {
  first: {label:'初回', icon:'🥂', desc:'お店に初めて来たお客さんとして'},
  nanpa: {label:'ナンパ', icon:'🌃', desc:'街で偶然声をかけた'},
  match: {label:'マッチングアプリ', icon:'💘', desc:'アプリでマッチした'},
};
for(const k in MEETS) MEETS[k].start = Relation.affinityOf(Relation.seed(k)); // エンジンの初期値と同じ式で出す
const LEVELS = [ // 親密度のしきい値
  {min:0,  name:'他人'},
  {min:20, name:'顔見知り'},
  {min:40, name:'常連'},
  {min:65, name:'お気に入り'},
  {min:90, name:'特別'},
];

const CHARS = Casts.list; // 定義は /casts.js が唯一の置き場（サーバーと共有）
const GHOST = id => ({id, name:'削除されたAI', kana:'', job:'', store:'', catch:'', status:'', tags:[], ghost:true});
const charById = id => CHARS.find(c=>c.id===id) || GHOST(id);

/* ---------- 2. STORE ---------- */
const KEY = 'yoruai.v1';
const GENDERS = {male:'男性', female:'女性'};
const DEFAULT = {me:{name:'あなた', status:'', gender:'male'}, mode:'light', ai:{provider:'gemini', key:'', model:'gemini-3.8-flash'}, friends:[], msgs:{}};
let S = load();
function load(){try{
  const d=structuredClone(DEFAULT),j=JSON.parse(localStorage.getItem(KEY))||{},o=Object.assign(d,j);
  o.me=Object.assign(structuredClone(DEFAULT.me),j.me||{});
  o.ai=Object.assign(structuredClone(DEFAULT.ai),j.ai||{});
  o.ai.provider='gemini'; delete o.ai.manualMock;
  o.ai.key=''; // clear any old API key saved in this prototype
  localStorage.setItem(KEY,JSON.stringify(o));
  if(!['light','night'].includes(o.mode))o.mode='light';
  if(!GENDERS[o.me.gender])o.me.gender='male';
  return o;
}catch(e){return structuredClone(DEFAULT)} }
const Backend={client:null,ready:false,userId:null,displayId:null,pendingName:null,lastModel:null,usedFallback:false,engineVersion:'engine-1.0.0',hydrating:false,saveTimer:null,queue:Promise.resolve()};
const ENGINE_FEATURES={
  persona:'人格と口調',relationship:'関係性',mood:'気分',memory:'長期記憶',initiative:'自発性'
};
// ---- 開発者画面で編集したキャストの取り込みと、AIからの連絡の受信
async function loadCastRows(){
  if(!Backend.client)return;
  try{
    const {data,error}=await Backend.client.from('casts').select('id,data,deleted');
    if(error)throw error;
    CHARS.splice(0,CHARS.length,...Casts.merge(data));
  }catch(e){console.warn('casts not loaded',e?.message||e)}
}
async function checkPushes(){
  if(!Backend.ready||!Backend.client||Backend.pushing)return;
  Backend.pushing=true;
  try{
    const {data,error}=await Backend.client.from('admin_pushes').select('id,char_id,text')
      .is('delivered_at',null).lte('deliver_at',new Date().toISOString()).order('deliver_at').limit(20);
    if(error)throw error;
    for(const p of data||[]){
      const f=S.friends.find(x=>x.charId===p.char_id);
      if(!f)continue;                                  // まだ友達でなければ、友達になるまで保留
      const {error:upErr}=await Backend.client.from('admin_pushes').update({delivered_at:new Date().toISOString()}).eq('id',p.id);
      if(upErr)continue;                               // 既読化できなければ重複を避けて届けない
      String(p.text).split('\n').map(x=>x.trim()).filter(Boolean).slice(0,6)
        .forEach((text,i)=>setTimeout(()=>pushMsg(f.id,{from:'ai',text,ts:Date.now()}),i*900));
    }
  }catch(e){console.warn('pushes not checked',e?.message||e)}
  finally{Backend.pushing=false}
}
async function syncRemote(){const before=JSON.stringify(CHARS);await loadCastRows();if(JSON.stringify(CHARS)!==before)refresh();checkPushes()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncRemote()});
setInterval(()=>{if(!document.hidden&&Backend.ready)syncRemote()},60000);

function ensureEngine(){
  if(!S.engine||typeof S.engine!=='object')S.engine={};
  const e=S.engine;
  if(!e.settings)e.settings={};
  if(!e.settings.flags)e.settings.flags={};
  for(const k of Object.keys(ENGINE_FEATURES))if(typeof e.settings.flags[k]!=='boolean')e.settings.flags[k]=true;
  e.settings.styleNote=String(e.settings.styleNote||'').slice(0,350);
  e.settings.revision=Math.max(1,Number(e.settings.revision)||1);
  if(!e.actors||typeof e.actors!=='object')e.actors={};
  if(!Array.isArray(e.logs))e.logs=[];
  if(!Array.isArray(e.evaluations))e.evaluations=[];
  if(!e.pendingReplies||typeof e.pendingReplies!=='object')e.pendingReplies={};
  if(!e.outages||typeof e.outages!=='object')e.outages={};
  return e;
}
ensureEngine();
function actorState(fid){return ensureEngine().actors[fid]||null;}
function applyEngineResult(fid,result,history,elapsedMs,mode){
  if(!result?.engineState)return;
  const e=ensureEngine();
  e.actors[fid]=result.engineState;
  if(result.profile&&Array.isArray(result.profile.requests))e.profile={requests:result.profile.requests.slice(-8)};
  const f=friend(fid);
  if(f&&e.settings.flags.relationship!==false){
    const r=result.engineState.relationship||{};
    f.aff=Relation.affinityOf(r);
  }
  Backend.engineVersion=result.engineVersion||Backend.engineVersion;
  const input=history.filter(m=>m.from==='me').slice(-1)[0]?.text||'（自動メッセージ）';
  e.logs.unshift({id:Date.now()+'-'+Math.floor(Math.random()*100000),fid,mode:mode||'reply',
    input:input.slice(0,300),output:result.messages.join(' / ').slice(0,500),
    model:result.model||'',version:Backend.engineVersion,
    revision:e.settings.revision,elapsedMs,at:Date.now(),rating:0,
    features:{...e.settings.flags}});
  e.logs=e.logs.slice(0,60);
  save();
}
function cleanState(){const copy=structuredClone(S);copy.ai=Object.assign({},copy.ai,{key:'',provider:'gemini'});delete copy.ai.manualMock;return copy}
function save(){
  S.ai.key='';
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(!Backend.ready)return;
  clearTimeout(Backend.saveTimer);
  Backend.saveTimer=setTimeout(()=>{
    const state=cleanState(),user_id=Backend.userId;
    Backend.queue=Backend.queue.then(async()=>{
      const {error}=await Backend.client.from('app_states').upsert({user_id,state,updated_at:new Date().toISOString()});
      if(error)throw error;
    }).catch(e=>{console.error('Cloud save failed',e);toast('クラウド保存に失敗しました')});
  },500);
}
function showAuthGate(message){
  let el=document.getElementById('auth-gate');
  if(!el){el=document.createElement('div');el.id='auth-gate';document.body.appendChild(el)}
  el.dataset.mode=document.getElementById('app')?.dataset.mode||'light';
  el.innerHTML='<div class="auth-panel"><div class="auth-logo" aria-hidden="true">夜</div><h3>yoruAIをはじめる</h3><p id="auth-info"></p>'+
    '<form id="auth-start"><input id="auth-name" type="text" required minlength="1" maxlength="12" autocomplete="nickname" placeholder="ユーザー名" aria-label="ユーザー名">'+
    '<button type="submit" id="auth-go">この名前ではじめる</button></form>'+
    '<small>メールアドレス・パスワード不要。専用IDを自動発行し、このブラウザにログイン情報を保存します。</small></div>';
  el.classList.add('show');
  const input=document.getElementById('auth-name');
  const savedName=Backend.pendingName||S.me?.name;
  if(savedName&&savedName!=='あなた')input.value=savedName;
  document.getElementById('auth-info').textContent=message||'まずユーザー名を決めてね。同じ名前の人でもIDは別々です。';
  document.getElementById('auth-start').onsubmit=async e=>{
    e.preventDefault();
    if(!Backend.client)return;
    const name=input.value.trim().replace(/\s+/g,' ');
    if(!name){document.getElementById('auth-info').textContent='ユーザー名を入力してください。';return}
    if(name.length>12){document.getElementById('auth-info').textContent='ユーザー名は12文字以内にしてください。';return}
    Backend.pendingName=name;
    const button=document.getElementById('auth-go');
    button.disabled=true;
    button.textContent='IDを発行中…';
    document.getElementById('auth-info').textContent='ログイン用のIDを発行しています。';
    try{
      const {data,error}=await Backend.client.auth.signInAnonymously({options:{data:{nickname:name}}});
      if(error)throw error;
      if(!data.user?.id)throw new Error('IDを発行できませんでした');
      await connectUser(data.user.id);
    }catch(err){
      const disabled=/anonymous|anon|disable|not enabled/i.test(String(err?.message||''));
      document.getElementById('auth-info').textContent=disabled
        ? '匿名ログインがSupabaseで無効です。Authentication → Providers → Anonymous Sign-Ins を有効にして、もう一度押してください。'
        : 'IDの発行に失敗しました: '+String(err?.message||err);
    }finally{
      button.disabled=false;
      button.textContent='この名前ではじめる';
    }
  };
}

async function connectUser(userId){
  if(Backend.hydrating||Backend.ready)return;
  Backend.hydrating=true;
  try{
    const {data,error}=await Backend.client.from('app_states').select('state').eq('user_id',userId).maybeSingle();
    if(error)throw error;
    if(data?.state&&Object.keys(data.state).length){
      const existing=data.state;
      S=Object.assign(structuredClone(DEFAULT),existing);
      S.me=Object.assign(structuredClone(DEFAULT.me),existing.me||{});
      S.ai=Object.assign(structuredClone(DEFAULT.ai),existing.ai||{});
      S.ai.key=''; S.ai.provider='gemini'; delete S.ai.manualMock;
    }else{
      const {error:writeError}=await Backend.client.from('app_states').upsert({user_id:userId,state:cleanState()});
      if(writeError)throw writeError;
    }
    ensureEngine();
    Backend.userId=userId;
    Backend.displayId='YA-'+userId.replaceAll('-','').slice(0,12).toUpperCase();
    if(Backend.pendingName){
      S.me.name=Backend.pendingName;
      Backend.pendingName=null;
    }
    await loadCastRows();
    Backend.ready=true;
    localStorage.setItem(KEY,JSON.stringify(cleanState()));
    save();
    document.getElementById('auth-gate')?.classList.remove('show');
    applyMode();refresh();toast('クラウド接続完了');
    resumePendingReplies();
    checkPushes();
    setTimeout(()=>maybeNudgeOnReturn(),1800);
  }catch(e){
    console.error('Supabase connection failed',e);
    showAuthGate('Supabaseへの保存に失敗しました: '+(e.message||e));
  }finally{Backend.hydrating=false}
}
async function initBackend(){
  try{
    const r=await fetch('/api/config',{cache:'no-store'});
    const config=await r.json();
    if(!r.ok)throw new Error(config.error||'設定取得エラー');
    if(!window.supabase?.createClient)throw new Error('Supabaseのライブラリを読み込めません');
    Backend.client=window.supabase.createClient(config.supabaseUrl,config.supabaseKey,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
    });
    Backend.client.auth.onAuthStateChange((event,session)=>{
      if(event==='SIGNED_IN'&&session?.user?.id&&!Backend.ready)setTimeout(()=>connectUser(session.user.id),0);
    });
    const {data:{session},error}=await Backend.client.auth.getSession();
    if(error)throw error;
    if(session?.user?.id){await connectUser(session.user.id);return}
    showAuthGate('ユーザー名を入力すると、専用IDが自動で発行されます。');
  }catch(e){
    console.error('Backend startup failed',e);
    if(Backend.client)showAuthGate('接続に失敗しました: '+(e.message||e));
    else toast('サーバー設定が読み込めません');
  }
}
const friend = id => S.friends.find(f=>f.id===id);
const levelOf = aff => { let l=0; LEVELS.forEach((x,i)=>{ if(aff>=x.min) l=i }); return l };

/* ---------- 3. AI ---------- */
// 返信生成の唯一の窓口。戻り値は「吹き出しの配列」。
async function requestEngine(f,history,options={}){
  if(!Backend.ready||!Backend.client)throw new Error('クラウドへの接続が必要です');
  const {data:{session},error:authError}=await Backend.client.auth.getSession();
  if(authError||!session?.access_token)throw new Error('ログインが必要です');
  const e=ensureEngine();
  const payload={
    charId:f.charId,meet:f.meet,affinity:f.aff,
    userName:S.me.name,userGender:S.me.gender,
    initialGreeting:options.initialGreeting===true,
    mode:options.mode||'reply',baseline:options.baseline===true,
    history:history.filter(m=>m.from==='me'||m.from==='ai').slice(-24).map(m=>({from:m.from,text:m.text})),
    engineState:actorState(f.id),profile:ensureEngine().profile||null,
    engineSettings:{flags:e.settings.flags,styleNote:e.settings.styleNote}
  };
  const res=await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},
    body:JSON.stringify(payload)
  });
  const result=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(result.error||'HTTP '+res.status);
  if(!Array.isArray(result.messages)||!result.messages.length)throw new Error('返信が空でした');
  return result;
}
async function generateReply(f,history,initialGreeting=false){
  const start=performance.now();
  const result=await requestEngine(f,history,{initialGreeting,mode:initialGreeting?'greeting':'reply'});
  Backend.lastModel=result.model||null;
  Backend.usedFallback=result.fallback===true;
  applyEngineResult(f.id,result,history,Math.round(performance.now()-start),initialGreeting?'greeting':'reply');
  return result.messages;
}
async function maybeNudgeOnReturn(){
  if(!Backend.ready||ensureEngine().settings.flags.initiative===false)return;
  const now=Date.now();
  const candidates=S.friends.filter(f=>{
    const msgs=S.msgs[f.id]||[];
    const userTurns=msgs.filter(m=>m.from==='me').length;
    const last=msgs.filter(m=>m.from==='me'||m.from==='ai').slice(-1)[0]?.ts||now;
    const state=actorState(f.id);
    return userTurns>=3 && now-last>10*3600000 && now-last<30*86400000 &&
      now-(state?.lastNudgeAt||0)>24*3600000 &&
      !busy[f.id]&&!greetBusy[f.id];
  }).sort((a,b)=>(S.msgs[b.id]?.slice(-1)[0]?.ts||0)-(S.msgs[a.id]?.slice(-1)[0]?.ts||0));
  const f=candidates[0];if(!f)return;
  busy[f.id]=true;typing[f.id]=true;refresh();
  try{
    const history=S.msgs[f.id]||[];
    const begin=performance.now();
    const result=await requestEngine(f,history,{mode:'nudge'});
    applyEngineResult(f.id,result,history,Math.round(performance.now()-begin),'nudge');
    for(const text of result.messages)pushMsg(f.id,{from:'ai',text,ts:Date.now()});
  }catch(e){console.warn('Nudge skipped',e.message);}
  finally{busy[f.id]=false;typing[f.id]=false;refresh();}
}

/* ---------- 4. CHAT FLOW ---------- */
const wait = ms => new Promise(r=>setTimeout(r,ms));
const busy = {}, typing = {}, greetBusy = {}, replyLocks = {};
const pendingTimers = {}, quietReadTimers = {};
let openChatId = null, tab = 'home';

function pushMsg(fid, m){
  (S.msgs[fid] ||= []).push(m);
  const f = friend(fid);
  if(m.from==='ai' && f && openChatId!==fid){ f.unread=(f.unread||0)+1; banner(f,m.text) }
  save(); refresh();
}

function readMessages(fid){
  let changed=false;
  for(const m of S.msgs[fid]||[]){
    if(m.from==='me'&&!m.read){m.read=true;changed=true}
  }
  if(changed){save();refresh()}
}
function cancelPendingTimers(fid){
  const t=pendingTimers[fid];
  if(t){clearTimeout(t.read);clearTimeout(t.request);delete pendingTimers[fid]}
}
function cancelAllScheduled(fid){
  cancelPendingTimers(fid);
  if(quietReadTimers[fid]){clearTimeout(quietReadTimers[fid]);delete quietReadTimers[fid]}
  delete ensureEngine().pendingReplies[fid];
  busy[fid]=false;
}
function inCharacterBusy(charId){
  const variants={
    kokoa:['ごめんね🥲今ちょっとバタバタしてる','いま手が離せなくて💦あとで返すね'],
    rena:['ごめんなさい、今少し立て込んでいて','今はちょっと手が離せません。また後で'],
    yume:['ごめん！今わちゃわちゃしてるにゃ💦','ちょっと忙しい！またあとでね！'],
    ren:['ごめん、今ちょっと手が離せない','今バタバタしてる！落ち着いたら返すね'],
    nagi:['すみません、今少し取り込んでいて','少し手が離せません。また後ほど'],
    mao:['ごめーーん、今めっちゃバタバタしてる笑','ちょい待って！今手が離されへん']
  };
  const lines=variants[charId]||variants.mao;
  return lines[Math.floor(Math.random()*lines.length)];
}
function noteModelOutage(fid,error){
  console.error('AI generation unavailable',fid,error);
  const e=ensureEngine(),now=Date.now(),prior=e.outages[fid]||{};
  const alreadyNotified=prior.active===true;
  e.outages[fid]={active:true,since:prior.since||now,lastErrorAt:now,
    retryAfter:now+90000,notified:alreadyNotified||false,
    failures:Math.min(100,(prior.failures||0)+1)};
  if(!alreadyNotified&&friend(fid)){
    e.outages[fid].notified=true;
    pushMsg(fid,{from:'ai',text:inCharacterBusy(friend(fid).charId),
      serviceFallback:true,ts:now});
  }
  save();
}
function planResponse(fid,options={}){
  if(!Backend.ready||!friend(fid)||greetBusy[fid])return;
  if(replyLocks[fid])return; // A request already started. Pending new messages are handled after it.
  const e=ensureEngine(),now=Date.now(),prior=e.outages[fid];
  if(prior?.active&&now<(prior.retryAfter||0)){
    clearTimeout(quietReadTimers[fid]);
    quietReadTimers[fid]=setTimeout(()=>{delete quietReadTimers[fid];readMessages(fid)},10000);
    return; // While unavailable, mark read without repeating the holding message.
  }
  const existing=e.pendingReplies[fid];
  if(ReplyTiming.valid(existing)){
    if(ReplyTiming.shouldExpedite({plan:existing,previousUserAt:options.previousUserAt,now})){
      e.pendingReplies[fid]=ReplyTiming.expedite(existing,now);
      save();
      armPending(fid);
    }
    return; // All consecutive messages are collected for ONE Gemini request.
  }
  const messages=S.msgs[fid]||[];
  const firstResponse=!messages.some(m=>m.from==='ai'&&!m.serviceFallback);
  const p=ReplyTiming.plan({now,firstResponse,lastInteractionAt:options.lastInteractionAt||0});
  e.pendingReplies[fid]=p;
  busy[fid]=true;
  save();
  armPending(fid);
}
function armPending(fid){
  cancelPendingTimers(fid);
  const p=ensureEngine().pendingReplies[fid];
  if(!Backend.ready||!friend(fid)||!ReplyTiming.valid(p)||replyLocks[fid])return;
  busy[fid]=true;
  pendingTimers[fid]={
    read:setTimeout(()=>{
      if(ensureEngine().pendingReplies[fid]?.requestAt===p.requestAt)readMessages(fid);
    },Math.max(0,p.readAt-Date.now())),
    request:setTimeout(()=>deliverPending(fid,p),Math.max(0,p.requestAt-Date.now()))
  };
}
function resumePendingReplies(){
  const e=ensureEngine();
  for(const [fid,p] of Object.entries(e.pendingReplies)){
    if(!friend(fid)||!ReplyTiming.valid(p)){delete e.pendingReplies[fid];continue}
    armPending(fid);
  }
  save();
}
function sendMsg(fid,text){
  if(!Backend.ready){toast('接続を準備中です');return}
  const prev=(S.msgs[fid]||[]).filter(m=>m.from==='me'||m.from==='ai');
  const last=prev.length?prev[prev.length-1].ts:0;
  const previousUserAt=prev.filter(m=>m.from==='me').slice(-1)[0]?.ts||0;
  pushMsg(fid,{from:'me',text,ts:Date.now(),read:false});
  if(!greetBusy[fid])planResponse(fid,{lastInteractionAt:last,previousUserAt});
}
async function deliverPending(fid,plan){
  const e=ensureEngine();
  if(e.pendingReplies[fid]?.requestAt!==plan.requestAt||replyLocks[fid])return;
  cancelPendingTimers(fid);
  delete e.pendingReplies[fid];
  const f=friend(fid);
  if(!f){busy[fid]=false;save();return}
  const addedAt=f.addedAt;
  replyLocks[fid]=true;
  busy[fid]=true;
  readMessages(fid);
  typing[fid]=true;refresh();
  const captured=(S.msgs[fid]||[]).slice();
  const capturedUserCount=captured.filter(m=>m.from==='me').length;
  let succeeded=false;
  try{
    // IMPORTANT: the API is called only AFTER the scheduled wait.
    // Every message sent while waiting is passed as one conversation history.
    const parts=await generateReply(f,captured);
    if(friend(fid)?.addedAt!==addedAt)return;
    if(e.outages[fid])delete e.outages[fid];
    for(let i=0;i<parts.length;i++){
      if(i){typing[fid]=true;refresh();await wait(200+Math.min(1200,parts[i].length*24))}
      typing[fid]=false;
      pushMsg(fid,{from:'ai',text:parts[i],ts:Date.now()});
    }
    succeeded=true;
  }catch(error){
    // API failures stay in dev logs, never visible in the chat transcript.
    if(friend(fid)?.addedAt===addedAt)noteModelOutage(fid,error);
  }finally{
    typing[fid]=false;replyLocks[fid]=false;busy[fid]=false;
    save();refresh();
    if(succeeded&&friend(fid)?.addedAt===addedAt){
      const currentCount=(S.msgs[fid]||[]).filter(m=>m.from==='me').length;
      // New messages received WHILE Gemini was generating need a new combined response.
      if(currentCount>capturedUserCount)planResponse(fid,{
        lastInteractionAt:Date.now(),
        previousUserAt:(S.msgs[fid]||[]).filter(m=>m.from==='me').slice(-2)[0]?.ts||0
      });
    }
  }
}

function addFriend(charId, meet){
  const id = charId;
  S.friends = S.friends.filter(f=>f.id!==id);
  S.friends.push({id, charId, meet, aff:MEETS[meet].start, addedAt:Date.now(), unread:0});
  S.msgs[id] = [{from:'sys', text:`${MEETS[meet].icon} ${MEETS[meet].label}で出会った`, ts:Date.now()}];
  cancelAllScheduled(id);
  delete ensureEngine().outages[id];
  ensureEngine().actors[id]=null;
  save();
  startGreeting(id,S.friends.find(f=>f.id===id).addedAt);
}
async function startGreeting(fid,addedAt){
  greetBusy[fid]=true;
  try{
    await wait(900);
    const f=friend(fid);
    if(!f || f.addedAt!==addedAt)return;
    if((S.msgs[fid]||[]).some(m=>m.from==='me'))return;
    typing[fid]=true;refresh();
    const parts=await generateReply(f,[],true);
    if(friend(fid)?.addedAt!==addedAt)return;
    if((S.msgs[fid]||[]).some(m=>m.from==='me'))return;
    for(let i=0;i<parts.length;i++){
      if(i)await wait(170+Math.min(800,parts[i].length*22));
      if(friend(fid)?.addedAt!==addedAt)return;
      if((S.msgs[fid]||[]).some(m=>m.from==='me'))return;
      pushMsg(fid,{from:'ai',text:parts[i],ts:Date.now()});
    }
  }catch(e){
    if(friend(fid)?.addedAt===addedAt)noteModelOutage(fid,e);
  }finally{
    typing[fid]=false;
    delete greetBusy[fid];
    refresh();
    if(friend(fid)?.addedAt===addedAt&&(S.msgs[fid]||[]).some(m=>m.from==='me')){
      const ms=(S.msgs[fid]||[]).filter(m=>m.from==='me');
      planResponse(fid,{previousUserAt:ms.length>1?ms[ms.length-2].ts:0,
        lastInteractionAt:ms.length>1?ms[ms.length-2].ts:0});
    }
  }
}

/* ---------- 5. VIEWS ---------- */
// アバターの色：彩度を落とした地色＋同系の濃い文字色
const TONES = {kokoa:['#F7DCE2','#B23A57'], rena:['#DFE3EC','#3F4B68'], yume:['#F6E9CF','#8E6420'],
               ren:['#E4E0F2','#4F4290'], nagi:['#D8EAE7','#2E6660'], mao:['#F6E0D8','#A1482D']};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toneOf = c => TONES[c.id] || Object.values(TONES)[[...String(c.id)].reduce((a,ch)=>a+ch.charCodeAt(0),0) % Object.keys(TONES).length];
const tv = c => `--tb:${toneOf(c)[0]};--tf:${toneOf(c)[1]}`;
const safeIcon = u => /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u||'') ? u : '';
const av = (c,s) => safeIcon(c.icon)
  ? `<span class="av" style="--s:${s}px;${tv(c)}"><img alt="" src="${safeIcon(c.icon)}"></span>`
  : `<span class="av" style="--s:${s}px;${tv(c)}">${esc(c.name[0])}</span>`;
const meAv = s => `<span class="av me" style="--s:${s}px">${esc((S.me.name||'あ')[0])}</span>`;
const hhmm = ts => { const d=new Date(ts); return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0') };
const dayLabel = ts => { const d=new Date(ts), n=new Date();
  if(d.toDateString()===n.toDateString()) return '今日';
  const y=new Date(n); y.setDate(n.getDate()-1); if(d.toDateString()===y.toDateString()) return '昨日';
  return `${d.getMonth()+1}月${d.getDate()}日(${'日月火水木金土'[d.getDay()]})` };
const listTime = ts => { const l=dayLabel(ts); return l==='今日'?hhmm(ts):l.replace(/\(.\)/,'') };
const lastMsg = fid => [...(S.msgs[fid]||[])].reverse().find(m=>m.from!=='sys');
const affPct = f => { const l=levelOf(f.aff), cur=LEVELS[l], nx=LEVELS[l+1]; return nx ? (f.aff-cur.min)/(nx.min-cur.min)*100 : 100 };

const I = {
  home:['<path d="M4 10.5 12 4l8 6.5V20H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>','<path d="M4 10.5 12 4l8 6.5V20H4z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>'],
  talk:['<path d="M12 4.5c-4.7 0-8.5 3-8.5 6.8 0 2.2 1.3 4.1 3.3 5.4l-.6 3 3.2-1.8c.8.2 1.7.3 2.6.3 4.7 0 8.5-3 8.5-6.9S16.7 4.5 12 4.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>','<path d="M12 4.5c-4.7 0-8.5 3-8.5 6.8 0 2.2 1.3 4.1 3.3 5.4l-.6 3 3.2-1.8c.8.2 1.7.3 2.6.3 4.7 0 8.5-3 8.5-6.9S16.7 4.5 12 4.5z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>'],
  set:['<circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M6 18l1.6-1.6M16.4 7.6 18 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>','<circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M6 18l1.6-1.6M16.4 7.6 18 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'],
};
const svg = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
const IC = {
  addp:svg('<circle cx="10" cy="8.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19.5c.8-3.3 3.4-5.2 6.5-5.2 1.4 0 2.7.4 3.8 1.1M18.5 13v6M15.5 16h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'),
  back:svg('<path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'),
  close:svg('<path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>'),
  menu:svg('<path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'),
  send:svg('<path d="M12 19V6M6.5 11.5 12 6l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'),
  talk:svg(I.talk[0]),
  redo:svg('<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9M4.5 4.5V9H9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'),
};

function refresh(){ renderNav(); renderTab(); if(openChatId) renderMsgs() }

function renderNav(){
  const unread = S.friends.reduce((a,f)=>a+(f.unread||0),0);
  const items = [['home','ホーム'],['talk','トーク'],['set','設定']];
  $('#nav').innerHTML = items.map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${svg(I[k][tab===k?1:0])}${l}${k==='talk'&&unread?`<span class="nb">${unread>99?'99+':unread}</span>`:''}</button>`).join('');
}

function renderTab(){
  const el = $('#tab');
  if(el.contains(document.activeElement) && document.activeElement.tagName==='INPUT') return;
  el.innerHTML = tab==='home' ? homeView() : tab==='talk' ? talkView() : setView();
}

function homeView(){
  const fr = S.friends.map(f=>({f,c:charById(f.charId)})).filter(x=>!x.c.ghost);
  const reco = CHARS.filter(c=>!friend(c.id));
  return `<div class="hd"><h1>ホーム</h1><button class="ib ac" data-act="add" aria-label="友だち追加">${IC.addp}</button></div>
  <button class="mine" data-tab="set">${meAv(60)}<div class="tx"><div class="t1">${esc(S.me.name)}</div><div class="t2">${esc(S.me.status||'ステータスメッセージを入力')}</div></div></button>
  <div class="sec"><b>友だち <span style="color:var(--accent)">${fr.length}</span></b></div>
  ${fr.length ? fr.map(({f,c})=>`<button class="row" data-act="profile" data-id="${f.id}">${av(c,46)}<div class="tx"><div class="t1">${esc(c.name)}</div><div class="t2">${esc(c.status)}</div></div></button>`).join('')
    : `<p class="foot" style="padding:6px 20px 4px">まだ友だちがいません。下から追加できます。</p>`}
  ${reco.length?`<div class="sec"><b>知り合いかも？</b></div>
  ${reco.map(c=>`<div class="row">${av(c,46)}<div class="tx"><div class="t1">${esc(c.name)}</div><div class="t2">${esc(c.job)}　${esc(c.store)}</div></div><button class="chip" data-act="add" data-id="${c.id}">追加</button></div>`).join('')}`:''}
  <div style="height:16px"></div>`;
}

function talkView(){
  const list = S.friends.map(f=>({f,c:charById(f.charId),m:lastMsg(f.id)})).filter(x=>x.m&&!x.c.ghost).sort((a,b)=>b.m.ts-a.m.ts);
  return `<div class="hd"><h1>トーク</h1><button class="ib ac" data-act="add" aria-label="友だち追加">${IC.addp}</button></div>
  ${list.length ? list.map(({f,c,m})=>`<button class="row trow" data-act="chat" data-id="${f.id}">${av(c,52)}
     <div class="tx"><div class="top"><span class="t1">${esc(c.name)}</span><span class="tm">${listTime(m.ts)}</span></div>
     <div class="bot"><span class="t2 ${typing[f.id]?'typ':''}">${typing[f.id]?'入力中…':esc(m.text.replace(/\n/g,' '))}</span>${f.unread?`<span class="ub">${f.unread}</span>`:''}</div></div></button>`).join('')
   : `<div class="empty"><b>トークはまだありません</b><p>友だちを追加すると、<br>相手からメッセージが届きます。</p><button class="btn" data-act="add">友だちを追加</button></div>`}`;
}

function setView(){
  const g = Object.entries(GENDERS);
  return `<div class="set"><div class="hd"><h1>設定</h1></div>
  <div class="sec"><b>プロフィール</b></div>
  <div class="grp">
    <div class="cell"><label for="s-name">名前</label><input id="s-name" value="${esc(S.me.name)}" maxlength="12"></div>
    <div class="cell"><label>固定ID</label><span style="font-size:12px;letter-spacing:.02em">${esc(Backend.displayId||'未発行')}</span></div>
    <div class="cell"><label>性別</label><span class="sp"></span><div class="seg">${g.map(([k,l])=>`<button class="${S.me.gender===k?'on':''}" data-act="gender" data-id="${k}">${l}</button>`).join('')}</div></div>
    <div class="cell"><label for="s-status">ステータス</label><input id="s-status" value="${esc(S.me.status)}" maxlength="30" placeholder="未設定"></div>
  </div>
  <p class="foot">名前は後から変更できますが、IDは変わりません。テスト版では、このブラウザのログイン情報を削除すると同じIDに戻れなくなります。</p>
  <div class="sec"><b>表示</b></div>
  <div class="grp"><div class="cell"><label>テーマ</label><span class="sp"></span><div class="seg">
    <button class="${S.mode==='light'?'on':''}" data-act="mode" data-id="light">ライト</button>
    <button class="${S.mode==='night'?'on':''}" data-act="mode" data-id="night">ダーク</button></div></div></div>
  <div class="sec"><b>会話AI（テスト）</b></div>
  <div class="grp"><div class="cell"><label>返信エンジン</label><span>${Backend.lastModel?esc(Backend.lastModel)+(Backend.usedFallback?'（予備）':''):'Gemini（サーバー接続）'}</span></div>
  <div class="cell"><label>クラウド保存</label><span>${Backend.ready?'接続済み':'接続待ち'}</span></div></div>
  <p class="foot">固定返信は停止しています。返答はGeminiが生成します。APIキーはサーバー側で管理します。</p>
  <div class="sec"><b>開発・改善</b></div>
  <div class="grp"><button class="cell" style="width:100%;text-align:left" data-act="open-lab">
    <span style="font-size:15px;flex:1">会話ラボ</span>
    <span style="color:var(--sub);font-size:13px">設定・比較・評価 ›</span>
  </button></div>
  <p class="foot">人格・関係性・気分・記憶・自発性を切り替え、同じ入力でA/B比較できます。</p>
  <div class="sec"><b>データ</b></div>
  <div class="grp"><button class="danger" data-act="reset">友だちとトークをすべて削除</button></div>
  <p class="foot" style="padding-bottom:28px">yoruAI 0.8</p></div>`;
}

/* --- トークルーム --- */
function openChat(fid){
  const f = friend(fid); if(!f) return;
  openChatId = fid; f.unread = 0; save(); $('#banner').classList.remove('show');
  const c = charById(f.charId);
  $('#chat').innerHTML = `<div class="lhd"><button class="ib" data-act="close-chat" aria-label="戻る">${IC.back}</button>
    <div class="ttl">${esc(c.name)}<small id="c-sub"></small></div>
    <button class="ib" data-act="profile" data-id="${fid}" aria-label="プロフィール">${IC.menu}</button></div>
    <div id="msgs"></div>
    <form class="cin" id="cin"><textarea id="inp" rows="1" placeholder="メッセージを入力" aria-label="メッセージ"></textarea><button class="send" id="sendb" aria-label="送信">${IC.send}</button></form>`;
  $('#chat').classList.add('open'); $('#profile').classList.remove('open');
  renderMsgs(true); refresh();
  const inp = $('#inp');
  inp.oninput = ()=>{ inp.style.height='auto'; inp.style.height=inp.scrollHeight+'px'; $('#sendb').classList.toggle('on', !!inp.value.trim()) };
  inp.onkeydown = e=>{ if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); $('#cin').requestSubmit() } };
  $('#cin').onsubmit = e=>{ e.preventDefault(); const v=inp.value.trim(); if(!v) return; if(!Backend.ready){toast('接続を準備中です');return} inp.value=''; inp.oninput(); sendMsg(fid, v); inp.focus() };
}
function closeChat(){ openChatId=null; $('#chat').classList.remove('open'); refresh() }

function renderMsgs(force){
  const fid = openChatId, f = friend(fid); if(!f) return;
  const c = charById(f.charId), box = $('#msgs');
  const near = force || box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  let html='', lastDay='', prev=null;
  for(const m of S.msgs[fid]||[]){
    const d = dayLabel(m.ts);
    if(d!==lastDay){ html+=`<div class="dsep"><span>${d}</span></div>`; lastDay=d; prev=null }
    if(m.from==='sys'){ html+=`<div class="sys ${m.text.includes('親密度')?'up':''}">${esc(m.text.replace(/^\S+\s/,''))}</div>`; prev=null; continue }
    const first = prev!==m.from;
    if(m.from==='me') html+=`<div class="m me ${first?'first':''}"><div class="meta">${m.read?'<span>既読</span>':''}<span>${hhmm(m.ts)}</span></div><div class="b">${esc(m.text)}</div></div>`;
    else html+=`<div class="m ai ${first?'first':''}"><div class="aw">${first?av(c,36):''}</div><div class="col">${first?`<div class="nm">${esc(c.name)}</div>`:''}<div class="bw"><div class="b">${esc(m.text)}</div><div class="meta">${hhmm(m.ts)}</div></div></div></div>`;
    prev = m.from;
  }
  if(typing[fid]){ const first = prev!=='ai'; html+=`<div class="m ai typing ${first?'first':''}"><div class="aw">${first?av(c,36):''}</div><div class="col"><div class="b"><i></i><i></i><i></i></div></div></div>` }
  box.innerHTML = html;
  $('#c-sub').innerHTML = typing[fid] ? '入力中…' : `親密度　<b style="color:var(--accent);font-weight:600">${LEVELS[levelOf(f.aff)].name}</b>`;
  if(near) box.scrollTop = box.scrollHeight;
}

/* --- プロフィール --- */
function openProfile(fid){
  const f = friend(fid), c = charById(f.charId), lv = levelOf(f.aff), nx = LEVELS[lv+1];
  const p = $('#profile'); p.setAttribute('style', tv(c));
  p.innerHTML = `<div class="lhd"><button class="ib" data-act="close-profile" aria-label="閉じる">${IC.close}</button><div class="ttl"></div><div style="width:44px"></div></div>
    <div class="pf">${av(c,96)}<h2>${esc(c.name)}</h2><div class="job">${esc(c.job)}　${esc(c.store)}</div><p class="st">${esc(c.status)}</p></div>
    <div class="pf-panel">
      <div class="aff"><span class="lv">${LEVELS[lv].name}</span><span class="bar"><i style="width:${affPct(f)}%"></i></span><span class="nx">${nx?`${nx.name}まで ${nx.min-f.aff}`:'最大'}</span></div>
      <p class="pf-note">${esc(Relation.note((actorState(fid)||{}).relationship||Relation.seed(f.meet)))}</p>
      <div class="pf-meta"><span>出会い方</span><span>${MEETS[f.meet].label}</span></div>
      <div class="acts"><button data-act="chat" data-id="${fid}">${IC.talk}トーク</button><button data-act="remeet" data-id="${c.id}">${IC.redo}出会い直す</button></div>
    </div>`;
  p.classList.add('open');
}

/* --- 友だち追加 --- */
let addSel = {idx:0, meet:'first'};
function openAdd(charId){
  addSel.idx = Math.max(0, CHARS.findIndex(c=>c.id===charId));
  addSel.meet = (charId && friend(charId)) ? friend(charId).meet : 'first';
  $('#add').innerHTML = `<div class="lhd"><button class="ib" data-act="close-add" aria-label="閉じる">${IC.close}</button><div class="ttl">友だち追加</div><div style="width:44px"></div></div>
    <div class="body">
      <div class="cards" id="cards">${CHARS.map(c=>`<div class="card" style="${tv(c)}">
        <div class="cv">${av(c,84)}${friend(c.id)?'<span class="got">追加済み</span>':''}</div>
        <div class="ci"><h3>${esc(c.name)}</h3><div class="job">${esc(c.job)}　${esc(c.store)}</div>
        <p class="cp">${esc(c.catch)}</p><p class="tg" style="color:var(--accent)">${c.tags.map(t=>'#'+esc(t)).join('　')}</p></div></div>`).join('')}</div>
      <div class="dots" id="dots">${CHARS.map(()=>'<i></i>').join('')}</div>
      <div class="meet-sec"><h4>出会い方</h4><div class="seg full" id="meets"></div><p class="meet-d" id="meetd"></p></div>
    </div>
    <div class="add-ft"><button class="btn wide" data-act="do-add" id="addbtn"></button></div>`;
  $('#add').classList.add('open');
  const cards = $('#cards');
  requestAnimationFrame(()=>{ cards.scrollLeft = cards.children[addSel.idx].offsetLeft - 32; updAdd() });
  cards.onscroll = ()=>{ const w = cards.children[0].offsetWidth+12; const i = Math.min(CHARS.length-1, Math.max(0, Math.round(cards.scrollLeft/w))); if(i!==addSel.idx){ addSel.idx=i; updAdd() } };
}
function updAdd(){
  const c = CHARS[addSel.idx], had = friend(c.id);
  [...$('#cards').children].forEach((d,i)=>d.classList.toggle('off', i!==addSel.idx));
  [...$('#dots').children].forEach((d,i)=>d.classList.toggle('on', i===addSel.idx));
  $('#meets').innerHTML = Object.entries(MEETS).map(([k,m])=>`<button class="${addSel.meet===k?'on':''}" data-act="meet" data-id="${k}">${m.label==='マッチングアプリ'?'マッチング':m.label}</button>`).join('');
  $('#meetd').textContent = MEETS[addSel.meet].desc + 'という設定で、最初のメッセージが届きます。';
  const b = $('#addbtn'); delete b.dataset.armed;
  b.textContent = had ? '出会い直す' : '追加';
}
function closeAdd(){ $('#add').classList.remove('open') }

/* --- 通知・トースト --- */
let bTimer;
function banner(f, text){
  const c = charById(f.charId), b = $('#banner');
  b.innerHTML = `${av(c,40)}<div class="tx"><div class="l1"><span>${esc(c.name)}</span><small>今</small></div><p>${esc(text.replace(/\n/g,' '))}</p></div>`;
  b.dataset.id = f.id; b.classList.add('show');
  clearTimeout(bTimer); bTimer = setTimeout(()=>b.classList.remove('show'), 3800);
}
let tTimer;
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(tTimer); tTimer=setTimeout(()=>el.classList.remove('show'),2000) }

function applyMode(){
  $('#app').dataset.mode = S.mode;
  document.querySelector('meta[name=theme-color]').content = S.mode==='night'?'#141416':'#FFFFFF';
}

/* ---------- EVENTS ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-tab],[data-act],#banner'); if(!t) return;
  if(t.id==='banner'){ t.classList.remove('show'); closeAdd(); $('#profile').classList.remove('open'); openChat(t.dataset.id); return }
  if(t.dataset.tab){ tab=t.dataset.tab; refresh(); $('#tab').scrollTop=0; return }
  const id = t.dataset.id;
  switch(t.dataset.act){
    case 'open-lab': LabUI.open(); break;
    case 'close-lab': LabUI.close(); break;
    case 'lab-toggle': LabUI.toggle(id); break;
    case 'lab-forget': LabUI.forget(id); break;
    case 'lab-vote': LabUI.vote(id); break;
    case 'lab-rate': LabUI.rate(id,Number(t.dataset.score)); break;
    case 'add': openAdd(id); break;
    case 'close-add': closeAdd(); break;
    case 'meet': addSel.meet=id; updAdd(); break;
    case 'do-add': {
      if(!Backend.ready){toast('接続を準備中です');break}
      const c = CHARS[addSel.idx], again = !!friend(c.id);
      if(again && !t.dataset.armed){ t.dataset.armed=1; t.textContent='トーク履歴が消えます。もう一度押して確定'; return }
      addFriend(c.id, addSel.meet); closeAdd(); $('#profile').classList.remove('open');
      if(openChatId===c.id) closeChat();
      tab='talk'; refresh(); toast(again?`${c.name}と出会い直しました`:`${c.name}を追加しました`); break; }
    case 'profile': openProfile(id); break;
    case 'close-profile': $('#profile').classList.remove('open'); break;
    case 'chat': $('#profile').classList.remove('open'); openChat(id); break;
    case 'close-chat': closeChat(); break;
    case 'remeet': openAdd(id); break;
    case 'gender': S.me.gender=id; save(); refresh(); break;
    case 'mode': S.mode=id; save(); applyMode(); refresh(); break;
    case 'reset':
      if(t.dataset.armed){ S=structuredClone(DEFAULT); save(); applyMode(); tab='home'; refresh(); toast('削除しました') }
      else { t.dataset.armed=1; t.textContent='もう一度押すと削除します（元に戻せません）' }
      break;
  }
});
document.addEventListener('input', e=>{
  const id = e.target.id;
  if(id==='s-name'){ S.me.name = e.target.value.trim()||'あなた'; save() }
  if(id==='s-status'){ S.me.status = e.target.value; save() }
});

/* ---------- BOOT ---------- */
applyMode(); refresh(); initBackend();
</script>
